<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ProfSoutenu - Assistant Pédagogique{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="{% url 'dashboard' %}" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-black">PS</div>
        <span class="font-extrabold text-xl text-slate-900">Prof<span class="text-indigo-600">Soutenu</span></span>
      </a>
      <div class="flex items-center gap-3">
        {% if user.is_authenticated %}
          <span class="text-xs font-semibold text-slate-500">Connecté : {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">Déconnexion</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="px-4 py-2 text-xs font-bold text-slate-700 hover:text-slate-900">Connexion</a>
          <a href="{% url 'inscription' %}" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl">Inscription</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
