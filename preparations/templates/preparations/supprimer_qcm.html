{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center space-y-4">
  <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
  </div>
  <h1 class="text-xl font-bold text-slate-900">Supprimer le QCM ?</h1>
  <p class="text-sm text-slate-500">Êtes-vous sûr de vouloir supprimer l'évaluation <strong>« {{ qcm.titre }} »</strong> ? Cette action est irréversible.</p>

  <form method="post" class="flex items-center justify-center gap-3 pt-2">
    {% csrf_token %}
    <a href="{% url 'detail_qcm' qcm.pk %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Annuler</a>
    <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-xl transition">Confirmer la suppression</button>
  </form>
</div>
{% endblock %}
