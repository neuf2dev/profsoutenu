<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ fiche.titre }} - Fiche de préparation</title>
    <style>
        @page {
            size: A4;
            margin: 1.5cm;
            @bottom-right {
                content: "Page " counter(page) " / " counter(pages);
                font-size: 9pt;
                color: #64748b;
            }
            @bottom-left {
                content: "ProfSoutenu — Fiche pédagogique";
                font-size: 9pt;
                color: #64748b;
            }
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #1e293b;
            line-height: 1.5;
            font-size: 11pt;
        }
        .header {
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .badges {
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 9pt;
            font-weight: bold;
            text-transform: uppercase;
        }
        .duration {
            float: right;
            font-weight: bold;
            color: #475569;
            font-size: 10pt;
        }
        h1 {
            font-size: 20pt;
            margin: 6px 0;
            color: #0f172a;
        }
        .theme {
            font-size: 11pt;
            color: #64748b;
            margin: 0;
        }
        .section-title {
            font-size: 13pt;
            font-weight: bold;
            color: #1e1b4b;
            margin-top: 20px;
            margin-bottom: 8px;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 4px;
        }
        .box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            white-space: pre-wrap;
            font-size: 10.5pt;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="duration">⏱ {{ fiche.duree }} min</span>
        <div class="badges">
            <span class="badge">{{ fiche.niveau }}</span>
            <span class="badge">{{ fiche.matiere }}</span>
        </div>
        <h1>{{ fiche.titre }}</h1>
        <p class="theme"><strong>Thème :</strong> {{ fiche.theme }}</p>
    </div>

    <div class="section-title">🎯 Objectifs pédagogiques & Compétences</div>
    <div class="box">{{ fiche.objectifs }}</div>

    <div class="section-title">📋 Déroulé de la séance (5 phases)</div>
    <div class="box">{{ fiche.deroule_seance }}</div>

    <div class="section-title">✍️ Exercices types & Évaluation</div>
    <div class="box">{{ fiche.exercices_types }}</div>
</body>
</html>
